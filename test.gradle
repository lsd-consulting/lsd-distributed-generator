dependencies {
    testImplementation 'io.mockk:mockk-jvm:1.14.11'
    testImplementation 'org.jeasy:easy-random-core:5.0.0'
    testImplementation 'org.hamcrest:hamcrest-core:3.0'
    testImplementation 'org.apache.commons:commons-lang3:3.20.0'
    // Boot 4 BOM manages JUnit 6 — do not pin 5.x engines (breaks discovery)
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // pitest-junit5-plugin must NOT be on the test classpath: it shades old
    // JUnit Platform APIs and makes Gradle discover 0 tests under JUnit 6.
    // Pitest pulls it via junit5PluginVersion in pitest.gradle instead.
}

test {
    useJUnitPlatform()
    testLogging.events("skipped", "failed")
    finalizedBy jacocoTestReport
    afterSuite { desc, result ->
        if (!desc.parent) {
            logger.lifecycle("Test results: (${result.testCount} tests, ${result.successfulTestCount} successes, ${result.failedTestCount} failures, ${result.skippedTestCount} skipped)")
            if (result.testCount == 0) {
                throw new IllegalStateException("No tests were found. Failing the build")
            }
        }
    }
}
